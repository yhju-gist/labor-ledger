  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(raw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c));return new TextDecoder().decode(pt)}
async function go_(code,quiet){const m=$("msg"),bt=$("b");if(!(window.crypto&&crypto.subtle)){m.textContent="이 브라우저에서는 열 수 없습니다. 크롬·엣지·사파리 최신판으로 열어 주세요.";return}
  bt.disabled=true;bt.textContent="여는 중";m.textContent="";
  try{const html=await open_(code);try{if($("rm").checked)localStorage.setItem(K,code);}catch(e){}document.open();document.write(html);document.close()}
  catch(e){bt.disabled=false;bt.textContent="열기";try{localStorage.removeItem(K)}catch(x){}if(!quiet)m.textContent=e.message==="len"?"코드는 16자리입니다. 다시 확인해 주세요.":"코드가 맞지 않습니다. 다시 확인해 주세요."}}
$("c").addEventListener("input",e=>{const r=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,16);e.target.value=r.replace(/(.{4})(?=.)/g,"$1-")});
$("f").addEventListener("submit",e=>{e.preventDefault();go_($("c").value)});
try{const sv=localStorage.getItem(K);if(sv){$("c").value=sv;$("rm").checked=true;go_(sv,true)}}catch(e){}})();
</script></body></html>
